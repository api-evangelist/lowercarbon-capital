name: Lowercarbon Capital
description: 'Lowercarbon Capital is a climate-focused venture capital firm that backs companies making
  real money by slashing CO2 emissions, removing carbon from the atmosphere, and buying the planet more
  time. The firm invests across energy, transportation, materials, agriculture, carbon removal, and
  planetary-cooling technologies, on the thesis that markets — not shame or guilt — will fix the climate.
  It was surfaced as a portfolio-linked company and added to the API Evangelist network. Lowercarbon
  Capital publishes no public API or developer program; this profile captures the firm''s identity and
  web properties.'
